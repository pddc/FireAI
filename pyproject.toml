[project]
name = "fireai"
version = "2.0.0a0"
description = "FireAI - cloud-connected pellet smoker controller (hard fork of PiFire)"
readme = "README.md"
license = { text = "MIT" }
requires-python = ">=3.11"
dependencies = [
    "redis>=5.3,<6",
    "apprise>=1.9",
    "paho-mqtt>=2.1",
    "psutil>=7.0",
    "ratelimitingfilter>=1.5",
    "pillow>=11.0",
    "requests>=2.32",
    "cryptography>=43.0",
    "pydantic>=2.9",
    "pydantic-settings>=2.5",
]

[project.optional-dependencies]
# Legacy Flask UI (removed at Phase 5)
legacy = [
    "flask>=3.1",
    "flask_mobility>=2.0",
    "flask_qrcode>=3.2",
    "flask_socketio>=5.5",
    "gunicorn>=23.0",
]
# New local API server
server = [
    "fastapi>=0.115",
    "uvicorn[standard]>=0.32",
    "pyjwt>=2.9",
    "argon2-cffi>=23.1",
    "python-multipart>=0.0.12",
    "websockets>=13.0",
]
# Cloud bridge
bridge = [
    "firebase-admin>=6.6",
]
# Only installable on a Raspberry Pi
pi = [
    "gpiozero>=2.0",
    "rpi_hardware_pwm>=0.2",
    "bleak>=0.22",
    "netifaces>=0.11",
    "zeroconf>=0.147",
    "scikit-fuzzy>=0.5",
]
dev = [
    "pytest>=8.3",
    "pytest-cov>=6.0",
    "pytest-asyncio>=0.24",
    "fakeredis>=2.26",
    "httpx>=0.27",
    "ruff>=0.7",
    "freezegun>=1.5",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"
addopts = "-q --strict-markers"
markers = [
    "slow: long-running tests",
    "hardware: requires real hardware, skipped in CI",
]
filterwarnings = ["ignore::DeprecationWarning"]

[tool.ruff]
line-length = 120
target-version = "py311"
extend-exclude = ["static", "gh-pages", "docs", "display", "blueprints", "wizard.py", "updater.py", "board-config.py", "bt_diag.py"]

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP"]
ignore = ["E501", "W191", "E101", "B006", "B007", "B904", "UP031", "E722", "B023"]

[tool.ruff.lint.per-file-ignores]
"tests/*" = ["E402"]
"server/*" = ["B008"]  # FastAPI Depends() defaults are the idiom
"common/*" = ["F403", "F405", "E741", "F841", "E711", "E712", "B018", "F811", "UP"]
"control.py" = ["F403", "F405", "E741", "F841", "E711", "E712"]
"notify/*" = ["F403", "F405", "E741", "F841", "E711", "E712", "B", "UP"]
"probes/*" = ["F403", "F405", "E741", "F841", "E711", "E712", "B", "UP"]
"grillplat/*" = ["F403", "F405", "E741", "F841", "E711", "E712", "B", "UP"]
"controller/*" = ["F403", "F405", "E741", "F841", "E711", "E712", "B", "UP"]
"distance/*" = ["F403", "F405", "E741", "F841", "E711", "E712", "B", "UP"]
"file_mgmt/*" = ["F403", "F405", "E741", "F841", "E711", "E712", "B", "UP"]

[tool.coverage.run]
source = ["core", "server", "bridge", "controller", "probes", "file_mgmt", "common"]
omit = ["*/prototype.py", "tests/*"]

[build-system]
requires = ["setuptools>=70"]
build-backend = "setuptools.build_meta"

[tool.setuptools]
packages = ["core", "common", "controller", "probes", "grillplat", "distance", "notify", "file_mgmt", "server", "bridge"]
