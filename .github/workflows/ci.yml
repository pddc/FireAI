name: CI

on:
  push:
    branches: ["main"]
  pull_request:

jobs:
  python:
    name: Python (lint + tests)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v5
        with:
          enable-cache: true
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install
        run: |
          uv venv .venv
          uv pip install -e ".[dev,legacy,server,bridge]"
      - name: Lint
        run: .venv/bin/ruff check core server bridge tests
      - name: Test
        env:
          FIREAI_FAKE_REDIS: "1"
        run: .venv/bin/python -m pytest --cov --cov-report=term-missing:skip-covered

  web:
    name: Web (typecheck + tests + build)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: web
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: web/package-lock.json
      - run: npm ci
      - run: npm run typecheck
      - run: npm test
      - run: npm run build
      - uses: actions/upload-artifact@v4
        with:
          name: web-dist
          path: web/dist

  firebase:
    name: Firebase (functions tests + rules tests)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21
      - run: npm ci
        working-directory: firebase/functions
      - run: npm run build && npm test
        working-directory: firebase/functions
      - run: npm ci
        working-directory: firebase/rules-tests
      - run: npx firebase-tools emulators:exec --only database,firestore --project fireai-dev "cd rules-tests && npx vitest run"
        working-directory: firebase
