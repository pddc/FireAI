; FireAI processes. Installed to /etc/supervisor/conf.d/fireai.conf by deploy/install.sh
; All three run from the data directory so settings.json, history/ and logs/ live there.

[program:fireai-control]
command=__ROOT__/venv/bin/python control.py
directory=__ROOT__/data
user=__USER__
autostart=true
autorestart=true
startretries=3
stopasgroup=true
environment=FIREAI_REDIS_URL="redis://localhost:6379/0",SDL_AUDIODRIVER="dummy"
stderr_logfile=__ROOT__/data/logs/control.err.log
stdout_logfile=__ROOT__/data/logs/control.out.log

[program:fireai-server]
command=__ROOT__/venv/bin/uvicorn server.app:app --host 127.0.0.1 --port 8080 --workers 1 --proxy-headers --forwarded-allow-ips 127.0.0.1
directory=__ROOT__/data
user=__USER__
autostart=true
autorestart=true
startretries=3
environment=FIREAI_REDIS_URL="redis://localhost:6379/0",FIREAI_BRIDGE_CREDENTIALS="__ROOT__/data/bridge/credentials.json"
stderr_logfile=__ROOT__/data/logs/server.err.log
stdout_logfile=__ROOT__/data/logs/server.out.log

[program:fireai-bridge]
command=__ROOT__/venv/bin/python -m bridge.main
directory=__ROOT__/data
user=__USER__
autostart=true
autorestart=true
startretries=3
environment=FIREAI_REDIS_URL="redis://localhost:6379/0",FIREAI_BRIDGE_CREDENTIALS="__ROOT__/data/bridge/credentials.json"
stderr_logfile=__ROOT__/data/logs/bridge.err.log
stdout_logfile=__ROOT__/data/logs/bridge.out.log

[group:fireai]
programs=fireai-control,fireai-server,fireai-bridge
