name: CI

on:
  push:
    branches: ["main"]
  pull_request:

jobs:
  python:
    name: Python (lint + tests)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v5
        with:
          enable-cache: true
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install
        run: |
          uv venv .venv
          uv pip install -e ".[dev,legacy,server,bridge]"
      - name: Lint
        run: .venv/bin/ruff check core server bridge tests
      - name: Test
        env:
          FIREAI_FAKE_REDIS: "1"
        run: .venv/bin/python -m pytest --cov --cov-report=term-missing:skip-covered
