# FireAI: static PWA + API proxy. Installed to /etc/nginx/sites-available/fireai
server {
    listen 80 default_server;
    listen [::]:80 default_server;
    server_name _;

    root __ROOT__/current/web/dist;
    index index.html;

    # Never cache the service worker or the HTML shell; hashed assets are immutable.
    location = /sw.js { add_header Cache-Control "no-cache"; try_files $uri =404; }
    location = /index.html { add_header Cache-Control "no-cache"; }
    location /assets/ { add_header Cache-Control "public, max-age=31536000, immutable"; try_files $uri =404; }

    location /api/ {
        proxy_pass http://127.0.0.1:8080;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        client_max_body_size 25m;
        proxy_read_timeout 120s;
    }
    location /ws/ {
        proxy_pass http://127.0.0.1:8080;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "Upgrade";
        proxy_set_header Host $host;
        proxy_read_timeout 3600s;
    }
    location = /health { proxy_pass http://127.0.0.1:8080; }
    location /docs { proxy_pass http://127.0.0.1:8080; }
    location = /openapi.json { proxy_pass http://127.0.0.1:8080; }

    # SPA fallback
    location / { try_files $uri $uri/ /index.html; }
}
